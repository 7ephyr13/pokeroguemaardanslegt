
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Game</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #10251c, #172b25);
    font-family: Arial, sans-serif;
    color: white;
}

.game {
    width: 100%;
    max-width: 480px;
    padding: 20px;
    text-align: center;
}

h1 {
    color: #86efac;
    font-size: 42px;
    margin: 0 0 5px;
}

.subtitle {
    color: #a7cbb5;
    margin-bottom: 20px;
}

.scoreboard {
    display: flex;
    justify-content: space-between;
    background: #203d30;
    border: 1px solid #365c45;
    border-radius: 12px;
    padding: 13px 20px;
    margin-bottom: 15px;
    font-size: 18px;
}

canvas {
    width: 100%;
    height: auto;
    display: block;
    background: #172d24;
    border: 4px solid #4ade80;
    border-radius: 14px;
    box-shadow: 0 8px 30px #0005;
}

button {
    border: none;
    border-radius: 10px;
    padding: 13px 25px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    transform: scale(1.04);
}

.start-btn {
    margin-top: 18px;
    background: #4ade80;
    color: #12301e;
    width: 100%;
}

.controls {
    margin-top: 15px;
    display: grid;
    grid-template-columns: repeat(3, 55px);
    justify-content: center;
    gap: 7px;
}

.controls button {
    background: #315c43;
    color: white;
    padding: 10px;
    font-size: 22px;
    touch-action: manipulation;
}

.controls .empty {
    visibility: hidden;
}

#message {
    color: #a7cbb5;
    min-height: 24px;
    margin-top: 12px;
}
</style>
</head>

<body>

<div class="game">

    <h1>🐍 SNAKE</h1>
    <div class="subtitle">Vang de appels en word steeds langer!</div>

    <div class="scoreboard">
        <span>🍎 Score: <b id="score">0</b></span>
        <span>🏆 Beste: <b id="best">0</b></span>
    </div>

    <canvas id="canvas" width="400" height="400"></canvas>

    <button class="start-btn" id="startBtn" onclick="startGame()">
        ▶ START SPEL
    </button>

    <div id="message">Druk op Start om te beginnen!</div>

    <div class="controls">
        <button class="empty"> </button>
        <button onclick="changeDirection('UP')">⬆️</button>
        <button class="empty"> </button>

        <button onclick="changeDirection('LEFT')">⬅️</button>
        <button onclick="changeDirection('DOWN')">⬇️</button>
        <button onclick="changeDirection('RIGHT')">➡️</button>
    </div>

</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const box = 20;
const size = 400;

let snake = [];
let food = {};
let direction = "RIGHT";
let nextDirection = "RIGHT";
let score = 0;
let best = Number(localStorage.getItem("snakeBest")) || 0;
let running = false;
let gameOver = false;
let gameLoop = null;

// Score weergeven
document.getElementById("best").textContent = best;

// Achtergrond tekenen
function drawBackground() {
    ctx.fillStyle = "#172d24";
    ctx.fillRect(0, 0, size, size);

    ctx.strokeStyle = "#ffffff08";
    ctx.lineWidth = 1;

    for (let i = 0; i <= size; i += box) {
        ctx.beginPath();
        ctx.moveTo(i, 0);
        ctx.lineTo(i, size);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, i);
        ctx.lineTo(size, i);
        ctx.stroke();
    }
}

// Nieuwe appel
function createFood() {
    do {
        food = {
            x: Math.floor(Math.random() * 20) * box,
            y: Math.floor(Math.random() * 20) * box
        };
    } while (
        snake.some(part => part.x === food.x && part.y === food.y)
    );
}

// Appel tekenen
function drawFood() {
    const x = food.x;
    const y = food.y;

    // Schaduw
    ctx.fillStyle = "#0004";
    ctx.beginPath();
    ctx.ellipse(x + 11, y + 18, 9, 3, 0, 0, Math.PI * 2);
    ctx.fill();

    // Appel
    ctx.fillStyle = "#ef4444";
    ctx.beginPath();
    ctx.arc(x + 10, y + 12, 8, 0, Math.PI * 2);
    ctx.fill();

    // Steeltje
    ctx.strokeStyle = "#a16207";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x + 10, y + 5);
    ctx.lineTo(x + 12, y + 1);
    ctx.stroke();

    // Blaadje
    ctx.fillStyle = "#86efac";
    ctx.beginPath();
    ctx.ellipse(x + 15, y + 4, 4, 2, -0.5, 0, Math.PI * 2);
    ctx.fill();
}

// Slang tekenen
function drawSnake() {
    // Lichaam: van staart naar hoofd
    for (let i = snake.length - 1; i >= 0; i--) {
        const part = snake[i];
        const isHead = i === 0;

        ctx.fillStyle = isHead
            ? "#86efac"
            : (i % 2 === 0 ? "#4ade80" : "#22c55e");

        ctx.beginPath();
        ctx.roundRect(
            part.x + 1,
            part.y + 1,
            18,
            18,
            8
        );
        ctx.fill();

        // Kleine schubben
        if (!isHead) {
            ctx.fillStyle = "#ffffff30";
            ctx.beginPath();
            ctx.arc(part.x + 7, part.y + 7, 2, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    drawHead();
}

// Slangenhoofd met ogen en tong
function drawHead() {
    const head = snake[0];
    const cx = head.x + 10;
    const cy = head.y + 10;

    // Ogen afhankelijk van richting
    let eyes = [];

    if (direction === "RIGHT") {
        eyes = [[cx + 3, cy - 4], [cx + 3, cy + 4]];
    } else if (direction === "LEFT") {
        eyes = [[cx - 3, cy - 4], [cx - 3, cy + 4]];
    } else if (direction === "UP") {
        eyes = [[cx - 4, cy - 3], [cx + 4, cy - 3]];
    } else {
        eyes = [[cx - 4, cy + 3], [cx + 4, cy + 3]];
    }

    eyes.forEach(([x, y]) => {
        ctx.fillStyle = "white";
        ctx.beginPath();
        ctx.arc(x, y, 2.8, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#12301e";
        ctx.beginPath();
        ctx.arc(x, y, 1.3, 0, Math.PI * 2);
        ctx.fill();
    });

    // Gespleten tong
    let startX = cx, startY = cy;
    let endX = cx, endY = cy;

    if (direction === "RIGHT") {
        startX += 8;
        endX += 13;
    } else if (direction === "LEFT") {
        startX -= 8;
        endX -= 13;
    } else if (direction === "UP") {
        startY -= 8;
        endY -= 13;
    } else {
        startY += 8;
        endY += 13;
    }

    ctx.strokeStyle = "#fb7185";
    ctx.lineWidth = 1.8;
    ctx.lineCap = "round";

    ctx.beginPath();
    ctx.moveTo(startX, startY);
    ctx.lineTo(endX, endY);

    if (direction === "RIGHT" || direction === "LEFT") {
        ctx.moveTo(endX, endY);
        ctx.lineTo(endX + (direction === "RIGHT" ? 3 : -3), endY - 3);
        ctx.moveTo(endX, endY);
        ctx.lineTo(endX + (direction === "RIGHT" ? 3 : -3), endY + 3);
    } else {
        ctx.moveTo(endX, endY);
        ctx.lineTo(endX - 3, endY + (direction === "DOWN" ? 3 : -3));
        ctx.moveTo(endX, endY);
        ctx.lineTo(endX + 3, endY + (direction === "DOWN" ? 3 : -3));
    }

    ctx.stroke();
}

// Alles tekenen
function draw() {
    drawBackground();
    drawFood();
    drawSnake();
}

// Startscherm
function drawStartScreen() {
    drawBackground();

    ctx.fillStyle = "#4ade80";
    ctx.font = "bold 38px Arial";
    ctx.textAlign = "center";
    ctx.fillText("🐍 SNAKE", 200, 165);

    ctx.fillStyle = "#d1fae5";
    ctx.font = "17px Arial";
    ctx.fillText("Ben jij klaar?", 200, 205);

    ctx.font = "14px Arial";
    ctx.fillStyle = "#86a995";
    ctx.fillText("Druk op START SPEL", 200, 240);
}

// Start game
function startGame() {
    if (running) return;

    snake = [
        {x: 200, y: 200},
        {x: 180, y: 200},
        {x: 160, y: 200}
    ];

    direction = "RIGHT";
    nextDirection = "RIGHT";
    score = 0;
    gameOver = false;
    running = true;

    document.getElementById("score").textContent = score;
    document.getElementById("message").textContent = "Veel succes!";
    document.getElementById("startBtn").textContent = "↻ OPNIEUW STARTEN";

    createFood();
    draw();

    clearInterval(gameLoop);

    // Langzaam bewegen: 220 milliseconden
    gameLoop = setInterval(update, 220);
}

// Richting veranderen
function changeDirection(newDirection) {
    if (!running) return;

    if (newDirection === "UP" && direction !== "DOWN")
        nextDirection = "UP";

    if (newDirection === "DOWN" && direction !== "UP")
        nextDirection = "DOWN";

    if (newDirection === "LEFT" && direction !== "RIGHT")
        nextDirection = "LEFT";

    if (newDirection === "RIGHT" && direction !== "LEFT")
        nextDirection = "RIGHT";
}

// Toetsenbord
document.addEventListener("keydown", function(e) {
    const keys = {
        ArrowUp: "UP",
        ArrowDown: "DOWN",
        ArrowLeft: "LEFT",
        ArrowRight: "RIGHT",
        w: "UP",
        s: "DOWN",
        a: "LEFT",
        d: "RIGHT"
    };

    if (keys[e.key]) {
        e.preventDefault();
        changeDirection(keys[e.key]);
    }
});

// Game loop
function update() {
    if (!running) return;

    direction = nextDirection;

    let head = {...snake[0]};

    if (direction === "UP") head.y -= box;
    if (direction === "DOWN") head.y += box;
    if (direction === "LEFT") head.x -= box;
    if (direction === "RIGHT") head.x += box;

    const eating = head.x === food.x && head.y === food.y;

    const collisionBody = eating ? snake : snake.slice(0, -1);

    // Botsing controleren
    if (
        head.x < 0 || head.x >= size ||
        head.y < 0 || head.y >= size ||
        collisionBody.some(p => p.x === head.x && p.y === head.y)
    ) {
        endGame();
        return;
    }

    snake.unshift(head);

    if (eating) {
        score += 10;
        document.getElementById("score").textContent = score;

        if (score > best) {
            best = score;
            localStorage.setItem("snakeBest", best);
            document.getElementById("best").textContent = best;
        }

        createFood();
    } else {
        snake.pop();
    }

    draw();
}

// Game over
function endGame() {
    running = false;
    gameOver = true;
    clearInterval(gameLoop);

    draw();

    ctx.fillStyle = "#0009";
    ctx.fillRect(0, 0, size, size);

    ctx.fillStyle = "#f87171";
    ctx.font = "bold 36px Arial";
    ctx.textAlign = "center";
    ctx.fillText("GAME OVER", 200, 180);

    ctx.fillStyle = "white";
    ctx.font = "20px Arial";
    ctx.fillText("Score: " + score, 200, 220);

    document.getElementById("message").textContent =
        "Jammer! Probeer het nog eens.";

    document.getElementById("startBtn").textContent =
        "▶ OPNIEUW SPELEN";
}

// Initieel scherm
drawStartScreen();
</script>

</body>
</html>
